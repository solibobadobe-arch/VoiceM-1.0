name: Build VoiceM installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Размер локальной модели"
        required: false
        default: "small"
        type: choice
        options: [tiny, base, small, medium]

permissions:
  contents: write

concurrency:
  group: voicem-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: "1.1.0"
      MODEL: ${{ github.event.inputs.model || 'small' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0 pillow huggingface_hub

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Download local speech model
        run: python tools/fetch_model.py $env:MODEL

      - name: Build executable
        run: pyinstaller VoiceM.spec --noconfirm

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\voicem.iss

      - name: Make portable zip
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          Copy-Item -Recurse -Force models dist\VoiceM\models
          Compress-Archive -Path dist\VoiceM\* -DestinationPath "dist_installer\VoiceM-portable-$env:VERSION.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceM-windows
          path: dist_installer/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: VoiceM 1.1.0
          body: |
            VoiceM — голосовой ввод в любое поле ввода Windows.

            Файлы:
            - VoiceM-Setup-1.1.0.exe — установщик с вшитой локальной моделью (работает офлайн сразу)
            - VoiceM-portable-1.1.0.zip — портативная версия

            Новое в 1.1.0:
            - Полноценное окно настроек в чёрно-зелёном стиле
            - Бургер-меню слева сверху с плавной анимацией выезда
            - Разделы: Главная, Распознавание, Горячая клавиша, Доступы Windows, Система, История, О программе
            - Проверка доступа к микрофону и быстрые кнопки в параметры Windows
            - Ползунок автозапуска вместе с Windows
            - Выбор микрофона, сворачивание в трей, история распознанных фраз
            - Назначение горячей клавиши из окна без перезапуска

            Горячая клавиша по умолчанию: правый Alt (удерживать).
          files: dist_installer/*
